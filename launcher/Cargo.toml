[package]
name = "MashClient"
version = "4.5.6"
edition = "2021"
description = "MashClient — Minecraft 1.8.9 Launcher"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
webbrowser = "1.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
md5 = "0.7"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = "symbols"
