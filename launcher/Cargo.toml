[package]
name = "MashClient"
version = "4.1.0"
edition = "2021"
description = "MashClient 4.1 — Singularity Edition Native Desktop Launcher (WebView2 + OAuth2 Device Code + JVM 1.8.9)"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
webbrowser = "1.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
md5 = "0.7"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = "symbols"
