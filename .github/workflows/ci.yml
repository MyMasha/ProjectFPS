name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  mod-189:
    name: Mod Forge 1.8.9 (Java 8 & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Zulu JDK 8 & JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          cache: gradle
          java-version: |
            8
            17

      - name: Build & Test Mod
        run: |
          chmod +x ./gradlew
          ./gradlew test remapJar --no-daemon \
            -Dorg.gradle.java.home="${JAVA_HOME_17_X64}" \
            -Porg.gradle.java.installations.paths="${JAVA_HOME_8_X64},${JAVA_HOME_17_X64}"

  launcher-windows:
    name: Launcher Windows (Rust Check & Tests)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: launcher

      - name: Test Launcher (Rust unit tests)
        working-directory: launcher
        run: cargo test -- --skip test_live_microsoft_device_code_endpoint

      - name: Build Launcher (release without secrets)
        working-directory: launcher
        run: cargo build --release
