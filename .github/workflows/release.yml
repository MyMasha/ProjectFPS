name: MashClient Release (Mod 1.8.9 + Windows Setup + Portable + Vulkan Zink)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  build-mod:
    name: Build & Test Mod 1.8.9 (.jar)
    if: github.repository == 'MyMasha/ProjectFPS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Temurin JDK 8 & JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          cache: gradle
          java-version: |
            8
            17

      - name: Compile & Test MashClient Forge 1.8.9 Mod
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RAW_TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$RAW_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release tag format: $RAW_TAG" >&2
            exit 1
          fi
          CLEAN_VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          sed -i "s/^version=.*/version=${CLEAN_VER}/" gradle.properties
          chmod +x ./gradlew
          ./gradlew test remapJar --no-daemon \
            -Dorg.gradle.java.home="${JAVA_HOME_17_X64}" \
            -Porg.gradle.java.installations.paths="${JAVA_HOME_8_X64},${JAVA_HOME_17_X64}"
          test -s "build/libs/purefps-${CLEAN_VER}.jar"

      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod-jar
          path: build/libs/purefps-${{ steps.meta.outputs.version }}.jar
          if-no-files-found: error

  build-launcher:
    name: Build Windows Setup + Portable EXEs (OAuth2 + Zink)
    if: github.repository == 'MyMasha/ProjectFPS'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: launcher
          prefix-key: "v1-release"

      - name: Verify Microsoft OAuth2 Client ID & Sync Version
        id: ver
        shell: pwsh
        env:
          MASHCLIENT_MS_CLIENT_ID: ${{ secrets.MASHCLIENT_MS_CLIENT_ID }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:MASHCLIENT_MS_CLIENT_ID)) {
            throw "CRITICAL: GitHub Actions secret MASHCLIENT_MS_CLIENT_ID is empty or missing! Refusing to build an unauthenticated MashClient.exe."
          }
          $rawTag = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($rawTag -notmatch '^v?\d+\.\d+\.\d+$') {
            throw "CRITICAL: Invalid release tag format: $rawTag"
          }
          $cleanVer = $rawTag.TrimStart('v')
          "version=$cleanVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $cargoPath = "launcher/Cargo.toml"
          $content = Get-Content $cargoPath -Raw
          $updated = [regex]::Replace($content, '(?m)^version\s*=\s*"[^"]+"', "version = `"$cleanVer`"", 1)
          Set-Content -Path $cargoPath -Value $updated -NoNewline

      - name: Test & Build MashClient.exe (Public OAuth2 Client ID Only, No Embedded PAT)
        working-directory: launcher
        shell: pwsh
        env:
          MASHCLIENT_MS_CLIENT_ID: ${{ secrets.MASHCLIENT_MS_CLIENT_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $cargoHome = if (-not [string]::IsNullOrWhiteSpace($env:CARGO_HOME)) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $env:RUSTFLAGS = "--remap-path-prefix=$($env:GITHUB_WORKSPACE)=/src --remap-path-prefix=$cargoHome=/cargo -C link-arg=/PDBALTPATH:%_PDB%"
          cargo test -- --skip test_live_microsoft_device_code_endpoint
          cargo build --release
          $exePath = "target/release/MashClient.exe"
          if (-not (Test-Path $exePath)) {
            throw "MashClient.exe introuvable après compilation !"
          }
          $exeBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exePath))
          $exeAscii = [System.Text.Encoding]::ASCII.GetString($exeBytes)
          if (-not $exeAscii.Contains($env:MASHCLIENT_MS_CLIENT_ID.Trim())) {
            throw "CRITICAL: Compiled MashClient.exe does not contain embedded MASHCLIENT_MS_CLIENT_ID!"
          }
          Write-Host "Verified: MashClient.exe built with OAuth2 Client ID, sanitized paths, and zero embedded GitHub PAT."

      - name: Build Windows Installer (MashClient-Windows-Setup.exe) & Stage Portable + Zink
        shell: pwsh
        env:
          EXPECTED_ZINK_SHA256: "d3f71e2ef11c032a6d7b507ee2f6bab6ca3fb20543944af70982fc24b92604cb"
          CLEAN_VER: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "artifact-stage" | Out-Null

          # 1. Exécutable Windows Portable (utilisé directement et par l'Auto-Updater intégré pour les mises à jour)
          Copy-Item "launcher/target/release/MashClient.exe" -Destination "artifact-stage/MashClient-Windows-Portable.exe" -Force

          # 2. Installateur Windows Inno Setup (MashClient-Windows-Setup.exe)
          $isccCandidates = @(
            (Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $iscc = $isccCandidates | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup non trouvé dans les emplacements standards — installation via Chocolatey..."
            choco install innosetup -y --no-progress | Out-Host
            $iscc = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "CRITICAL: Inno Setup (ISCC.exe) introuvable pour compiler MashClient-Windows-Setup.exe."
          }
          $stageAbs = (Resolve-Path "artifact-stage").Path
          & $iscc "/DMyAppVersion=$($env:CLEAN_VER)" "/O$stageAbs" "launcher/installer/mashclient.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "CRITICAL: Échec de la compilation Inno Setup (exit code $LASTEXITCODE)."
          }
          if (-not (Test-Path "artifact-stage/MashClient-Windows-Setup.exe")) {
            throw "CRITICAL: artifact-stage/MashClient-Windows-Setup.exe introuvable après compilation Inno Setup."
          }

          # 3. Bundle Mesa3D 26.3.0 Zink vérifié par SHA-256 + Licences
          $trackedZip = "dist/mashclient-vulkan-zink-win64.zip"
          if (-not (Test-Path $trackedZip)) {
            throw "CRITICAL: Tracked $trackedZip missing; refusing unverified external binary download."
          }
          $actualHash = (Get-FileHash -Path $trackedZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:EXPECTED_ZINK_SHA256) {
            throw "CRITICAL: SHA-256 mismatch for $trackedZip (got $actualHash, expected $($env:EXPECTED_ZINK_SHA256))."
          }
          Copy-Item $trackedZip -Destination "artifact-stage/mashclient-vulkan-zink-win64.zip" -Force
          if (-not (Test-Path "LICENSE")) {
            throw "CRITICAL: Root LICENSE (GPL-3.0) missing; required for binary redistribution."
          }
          if (-not (Test-Path "THIRD_PARTY_LICENSES.md")) {
            throw "CRITICAL: THIRD_PARTY_LICENSES.md missing; required for Mesa3D (MIT) and SoftFloat (BSD-3-Clause) binary redistribution."
          }
          Copy-Item "LICENSE" -Destination "artifact-stage/LICENSE" -Force
          Copy-Item "THIRD_PARTY_LICENSES.md" -Destination "artifact-stage/THIRD_PARTY_LICENSES.md" -Force
          Write-Host "Verified & staged Setup, Portable, Zink ($actualHash), LICENSE, and THIRD_PARTY_LICENSES.md."

      - name: Upload Windows Setup, Portable & Zink Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-win64
          path: |
            artifact-stage/MashClient-Windows-Setup.exe
            artifact-stage/MashClient-Windows-Portable.exe
            artifact-stage/mashclient-vulkan-zink-win64.zip
            artifact-stage/LICENSE
            artifact-stage/THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  publish-release:
    name: Publish Atomic GitHub Release
    if: github.repository == 'MyMasha/ProjectFPS'
    needs: [build-mod, build-launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Mod JAR Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mod-jar
          path: release-assets

      - name: Download Windows Setup, Portable & Zink Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: launcher-win64
          path: release-assets

      - name: Publish All Release Assets & SHA256SUMS Atomically
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build-mod.outputs.tag }}
          RELEASE_VER: ${{ needs.build-mod.outputs.version }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ ! "$RELEASE_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release metadata" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "ERROR: Release $RELEASE_TAG already exists on $TARGET_REPO. Refusing to overwrite an existing published release; bump the version tag instead." >&2
            exit 1
          fi

          JAR_FILE="$(find release-assets -type f -name "purefps-${RELEASE_VER}.jar" | head -n 1)"
          SETUP_FILE="$(find release-assets -type f -name "MashClient-Windows-Setup.exe" | head -n 1)"
          PORTABLE_FILE="$(find release-assets -type f -name "MashClient-Windows-Portable.exe" | head -n 1)"
          ZINK_FILE="$(find release-assets -type f -name "mashclient-vulkan-zink-win64.zip" | head -n 1)"
          LICENSE_FILE="$(find release-assets -type f -name "LICENSE" | head -n 1)"
          NOTICES_FILE="$(find release-assets -type f -name "THIRD_PARTY_LICENSES.md" | head -n 1)"

          test -n "$JAR_FILE" && test -s "$JAR_FILE"
          test -n "$SETUP_FILE" && test -s "$SETUP_FILE"
          test -n "$PORTABLE_FILE" && test -s "$PORTABLE_FILE"
          test -n "$ZINK_FILE" && test -s "$ZINK_FILE"
          test -n "$LICENSE_FILE" && test -s "$LICENSE_FILE"
          test -n "$NOTICES_FILE" && test -s "$NOTICES_FILE"

          SUMS_FILE="release-assets/SHA256SUMS.txt"
          {
            printf "%s  %s\n" "$(sha256sum "$JAR_FILE" | awk '{print $1}')" "$(basename "$JAR_FILE")"
            printf "%s  %s\n" "$(sha256sum "$SETUP_FILE" | awk '{print $1}')" "$(basename "$SETUP_FILE")"
            printf "%s  %s\n" "$(sha256sum "$PORTABLE_FILE" | awk '{print $1}')" "$(basename "$PORTABLE_FILE")"
            printf "%s  %s\n" "$(sha256sum "$ZINK_FILE" | awk '{print $1}')" "$(basename "$ZINK_FILE")"
            printf "%s  %s\n" "$(sha256sum "$LICENSE_FILE" | awk '{print $1}')" "$(basename "$LICENSE_FILE")"
            printf "%s  %s\n" "$(sha256sum "$NOTICES_FILE" | awk '{print $1}')" "$(basename "$NOTICES_FILE")"
          } > "$SUMS_FILE"
          test -s "$SUMS_FILE"

          NOTES_FILE="release-assets/RELEASE_NOTES.md"
          cat > "$NOTES_FILE" <<EOF
          ## MashClient (PureFPS) ${RELEASE_TAG} — Minecraft Forge 1.8.9

          > **Avis légal :** NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT. Distribué sous licence **GNU GPL-3.0** (voir \`LICENSE\` et \`THIRD_PARTY_LICENSES.md\`).

          ### Téléchargements Windows
          - **\`MashClient-Windows-Setup.exe\`** *(recommandé)* : installateur Windows (sans droits administrateur, menu Démarrer + raccourci Bureau + désinstalleur Windows).
          - **\`MashClient-Windows-Portable.exe\`** : version portable autonome sans installation — également utilisée par l'**Auto-Updater** intégré pour mettre à jour le launcher en un clic.
          - **\`purefps-${RELEASE_VER}.jar\`** : mod Forge \`1.8.9\` seul (déployé automatiquement par le launcher).
          - **\`mashclient-vulkan-zink-win64.zip\`** : traducteur OpenGL -> Vulkan **Mesa3D 26.3.0 Zink** (Bêta, vérifié par SHA-256).
          - **\`SHA256SUMS.txt\`** : empreintes cryptographiques SHA-256 de tous les fichiers ci-dessus.
          EOF

          gh release create "$RELEASE_TAG" "$SETUP_FILE" "$PORTABLE_FILE" "$JAR_FILE" "$ZINK_FILE" "$LICENSE_FILE" "$NOTICES_FILE" "$SUMS_FILE" \
            --repo "$TARGET_REPO" \
            --target "$TARGET_SHA" \
            --title "MashClient ${RELEASE_TAG}" \
            --notes-file "$NOTES_FILE"
