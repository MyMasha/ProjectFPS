name: MashClient Release (Mod 1.8.9 + MashClient.exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version à publier (ex: v4.0.0)"
        required: true
        default: "v4.0.0"

permissions:
  contents: write

jobs:
  publish-mod-release:
    name: Build Mod 1.8.9 (.jar) & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 8 & JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Extract semantic version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"

      - name: Compile & Test MashClient Forge 1.8.9 Mod
        shell: bash
        run: |
          sed -i '/^org\.gradle\.java\./d' gradle.properties
          echo "org.gradle.java.home=${JAVA_HOME_17_X64}" >> gradle.properties
          echo "org.gradle.java.installations.auto-detect=false" >> gradle.properties
          echo "org.gradle.java.installations.paths=${JAVA_HOME_8_X64},${JAVA_HOME_17_X64}" >> gradle.properties
          sed -i "s/^version=.*/version=${{ steps.ver.outputs.version }}/" gradle.properties
          chmod +x ./gradlew
          ./gradlew test remapJar --no-daemon

      - name: Create or Update GitHub Release with Mod JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MashClient Singularity ${{ steps.ver.outputs.tag }}
          body: |
            ## MashClient ${{ steps.ver.outputs.version }} — Singularity Edition

            ### Nouveautés v4.0.0 — 200 Modules, Sous-Paramètres Clic Droit, HUD Magnétique & `MashClient.exe`
            - **Launcher renommé `MashClient.exe` + Logo `.ico` intégré + Réduction en Bas à Droite (System Tray)** : exécutable Windows `MashClient.exe` (sans `-launcher`) embarquant son logo Singularity multi-résolution (256/64/32/16 px) et se réduisant automatiquement dans la zone de notification Windows en bas à droite (`0 %` GPU/CPU en arrière-plan) dès l'ouverture de Minecraft.
            - **200 Modules style Lunar Client + Sous-Paramètres complets au Clic Droit (`RSHIFT`)** : `65` widgets HUD + `30` PvP + `35` Visuel + `25` Hypixel + `20` Monde + `25` Moteur FPS. Clic droit sur n'importe quel module pour configurer tous ses sous-paramètres : **Curseur Personnalisé** avec aperçu direct, **Champ de Vision PvP (FOV)** avec FOV de base personnalisée + Speed/Sprint/Arc, **Zoom Optique Pro** avec choix entre zoomer à la molette ou changer normalement de slot dans la barre d'action, Viewmodel XYZ, HurtCam 0–100 %, Time/Weather Changer, etc.
            - **Nouveau Menu `RSHIFT` Professionnel & Éditeur HUD Transparent à Aimantation Magnétique** : sélectionnez directement n'importe quel élément HUD à l'écran (rendu translucide pendant le déplacement) avec lignes guides dorées/cyan d'alignement d'axes, collage bord-à-bord entre éléments et verrouillage d'axe strict (`Shift`).
            - **Animations Trou Noir Ultra-Fluides (O(1) 600+ FPS) & Mode Plein Écran Sans Bordure (`Borderless`)** : lentille gravitationnelle analytique sans aucune boucle coûteuse ni `-XX:+AlwaysPreTouch` côté Launcher, et émergence 100 FPS sur le thread dédié `SplashProgress$3` côté Minecraft en fenêtre **Borderless** (`WS_POPUP` à `(0, 0)`).
            - **Stabilité Réseau Multijoueur & Haute Performance FPS** : pile IPv4 forcée (`-Djava.net.preferIPv4Stack=true`), double tentative OAuth2 Microsoft au lancement, `acceptableRemoteVersions = "*"`, sauvegardes JSON asynchrones hors-thread, batching UI 1-draw `NanoUiRenderer`, caches `O(1)` `FontRenderer` / `FastSkullCache` et zéro modification des tables trigonométriques de physique joueur.
          generate_release_notes: true
          files: build/libs/purefps-${{ steps.ver.outputs.version }}.jar

  build-and-attach-launcher:
    name: Build & Attach MashClient.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Launcher Cargo.toml version with Tag
        id: ver
        shell: pwsh
        run: |
          $rawTag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $cleanVer = $rawTag.TrimStart('v')
          "tag=$rawTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $cargoPath = "launcher/Cargo.toml"
          $content = Get-Content $cargoPath -Raw
          $updated = [regex]::Replace($content, '(?m)^version\s*=\s*"[^"]+"', "version = `"$cleanVer`"", 1)
          Set-Content -Path $cargoPath -Value $updated -NoNewline

      - name: Build MashClient.exe (with embedded .ico resource)
        working-directory: launcher
        env:
          PURECLIENT_GITHUB_TOKEN: ${{ secrets.PURECLIENT_UPDATER_TOKEN }}
        run: cargo build --release

      - name: Attach MashClient.exe to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          for ($i = 0; $i -lt 48; $i++) {
            gh release view $tag --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          gh release upload $tag "launcher/target/release/MashClient.exe" --repo "${{ github.repository }}" --clobber
