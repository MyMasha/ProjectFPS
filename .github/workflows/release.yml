name: MashClient Release (Mod 1.8.9 + MashClient.exe + Vulkan Zink)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v4.5.6)"
        required: true
        default: "v4.5.6"

permissions:
  contents: read

jobs:
  publish-prebuilt-local:
    name: Publish Locally Compiled Release Assets (Fast Path)
    if: github.repository == 'MyMasha/ProjectFPS'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.pub.outputs.published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish prebuilt local binaries if present in dist/
        id: pub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          JAR_FILE="dist/purefps-${CLEAN_VER}.jar"
          EXE_FILE="dist/MashClient.exe"
          ZINK_FILE="dist/mashclient-vulkan-zink-win64.zip"
          if [[ -f "$JAR_FILE" && -f "$EXE_FILE" && -f "$ZINK_FILE" ]]; then
            if gh release view "$RAW_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$RAW_TAG" "$JAR_FILE" "$EXE_FILE" "$ZINK_FILE" --clobber --repo "${{ github.repository }}"
            else
              gh release create "$RAW_TAG" "$JAR_FILE" "$EXE_FILE" "$ZINK_FILE" \
                --repo "${{ github.repository }}" \
                --title "MashClient ${RAW_TAG}" \
                --generate-notes
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Published locally compiled assets ($JAR_FILE, $EXE_FILE, $ZINK_FILE) in seconds!"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
  publish-mod-release:
    name: Fallback Build Mod 1.8.9 (.jar)
    needs: publish-prebuilt-local
    if: github.repository == 'MyMasha/ProjectFPS' && needs.publish-prebuilt-local.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 8 & JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          cache: gradle
          java-version: |
            8
            17

      - name: Compile & Test MashClient Forge 1.8.9 Mod
        id: check
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          sed -i "s/^version=.*/version=${CLEAN_VER}/" gradle.properties
          chmod +x ./gradlew
          ./gradlew test remapJar --no-daemon \
            -Dorg.gradle.java.home="${JAVA_HOME_17_X64}" \
            -Porg.gradle.java.installations.paths="${JAVA_HOME_8_X64},${JAVA_HOME_17_X64}"

      - name: Create or Update GitHub Release with Mod JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: MashClient ${{ steps.check.outputs.tag }}
          generate_release_notes: true
          files: build/libs/purefps-${{ steps.check.outputs.version }}.jar
