name: MashClient Release (Mod 1.8.9 + MashClient.exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version à publier (ex: v4.1.0)"
        required: true
        default: "v4.1.0"

permissions:
  contents: write

jobs:
  publish-mod-release:
    name: Build Mod 1.8.9 (.jar) & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 8 & JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Extract semantic version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"

      - name: Compile & Test MashClient Forge 1.8.9 Mod
        shell: bash
        run: |
          sed -i '/^org\.gradle\.java\./d' gradle.properties
          echo "org.gradle.java.home=${JAVA_HOME_17_X64}" >> gradle.properties
          echo "org.gradle.java.installations.auto-detect=false" >> gradle.properties
          echo "org.gradle.java.installations.paths=${JAVA_HOME_8_X64},${JAVA_HOME_17_X64}" >> gradle.properties
          sed -i "s/^version=.*/version=${{ steps.ver.outputs.version }}/" gradle.properties
          chmod +x ./gradlew
          ./gradlew test remapJar --no-daemon

      - name: Create or Update GitHub Release with Mod JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MashClient Singularity ${{ steps.ver.outputs.tag }}
          body: |
            ## MashClient ${{ steps.ver.outputs.version }} — Singularity Edition

            ### Nouveautés v4.1.0 — Trou Noir 3D Gargantua Proche, Rideau Noir `#000000` & Masquage Tray, Nouvelles UIs Desktop & Recherche Anglais/Français
            - **Trou Noir 3D Gargantua Rapproché (Launcher & Minecraft) — Sans Points Buggés ni Double Aura** : restauration du cadrage 3D rapproché de Gargantua (`camDist = 15.6 -> 0.82`) avec géodésiques de Schwarzschild RK2 fluides et **un seul disque d'accrétion équatorial 3D** courbé par la gravité (suppression de la double aura illogique). En jeu, l'espace profond est désormais d'un noir pur `#000000` avec étoiles circulaires analytiques 3D sans aucune lecture de texture bruitée (zéro point blanc/noir parasite).
            - **Transition Écran Noir `#000000` Continue & Fermeture Complète vers la Zone de Notification (System Tray)** : le Launcher garde son plein écran noir `#000000` actif sans jamais repasser en petite fenêtre `1240×780` après le plongeon, attend l'ouverture réelle de la fenêtre OpenGL `LWJGL` de Minecraft, puis se masque intégralement du bureau et de la barre des tâches (`SW_HIDE` + `WS_EX_TOOLWINDOW` + `set_skip_taskbar`) dans l'icône en bas à droite (`0 %` GPU).
            - **Refonte Intégrale des Interfaces En Jeu (`GuiPureMainMenu` & Menu `RSHIFT`) en Viewport Desktop `1280×720`** : correction des attributs génériques OpenGL 2.0 (`NanoUiRenderer`) + polices haute densité `SmoothFontRenderer`, nouveau menu principal verre fumé laissant Gargantua dégagé à droite, et nouvelle feuille `RSHIFT` inspirée du panneau Optimisations du Launcher (cartes aérées 2 colonnes, tiroir latéral de sous-paramètres au clic droit, éditeur HUD plein écran translucide à lignes magnétiques).
            - **Recherche Intelligente Bilingue Français + Anglais sur les 200 Modules** : catalogue complet des noms officiels anglais Lunar/Badlion (`Armor Status`, `No Hurt Cam` / `hurtcam`, `Custom Crosshair`, `Time Changer`, `Toggle Sprint`, `Freelook`, `1.7 Animations`, `Block Outline`, `Clear Water`, `UHC Overlay`, etc.) avec normalisation UK/US (`armour` -> `armor`), mots composés avec ou sans espace, tolérance aux fautes de frappe et tri par pertinence.
          generate_release_notes: true
          files: build/libs/purefps-${{ steps.ver.outputs.version }}.jar

  build-and-attach-launcher:
    name: Build & Attach MashClient.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Launcher Cargo.toml version with Tag
        id: ver
        shell: pwsh
        run: |
          $rawTag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $cleanVer = $rawTag.TrimStart('v')
          "tag=$rawTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $cargoPath = "launcher/Cargo.toml"
          $content = Get-Content $cargoPath -Raw
          $updated = [regex]::Replace($content, '(?m)^version\s*=\s*"[^"]+"', "version = `"$cleanVer`"", 1)
          Set-Content -Path $cargoPath -Value $updated -NoNewline

      - name: Build MashClient.exe (with embedded .ico resource)
        working-directory: launcher
        env:
          PURECLIENT_GITHUB_TOKEN: ${{ secrets.PURECLIENT_UPDATER_TOKEN }}
        run: cargo build --release

      - name: Attach MashClient.exe to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          for ($i = 0; $i -lt 48; $i++) {
            gh release view $tag --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          gh release upload $tag "launcher/target/release/MashClient.exe" --repo "${{ github.repository }}" --clobber
