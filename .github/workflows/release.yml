name: PureClient Release (Mod 1.8.9 + Singularity Launcher)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version à publier (ex: v3.5.0 ou v3.6.0)"
        required: true
        default: "v3.5.0"

permissions:
  contents: write

jobs:
  publish-mod-release:
    name: Build Mod 1.8.9 (.jar) & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 8 & JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Extract semantic version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"

      - name: Compile & Test PureClient Forge 1.8.9 Mod
        shell: bash
        run: |
          sed -i '/^org\.gradle\.java\./d' gradle.properties
          echo "org.gradle.java.home=${JAVA_HOME_17_X64}" >> gradle.properties
          echo "org.gradle.java.installations.auto-detect=false" >> gradle.properties
          echo "org.gradle.java.installations.paths=${JAVA_HOME_8_X64},${JAVA_HOME_17_X64}" >> gradle.properties
          sed -i "s/^version=.*/version=${{ steps.ver.outputs.version }}/" gradle.properties
          chmod +x ./gradlew
          ./gradlew test remapJar --no-daemon

      - name: Create or Update GitHub Release with Mod JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PureClient Singularity ${{ steps.ver.outputs.tag }}
          body: |
            ## PureClient ${{ steps.ver.outputs.version }} — Singularity Edition

            ### Moteur Graphique & Optimisations 1.8.9
            - **Zéro blocage GPU/CPU** : suppression des attentes JNI `glGetError`, transfert FBO DMA matériel (`glBlitFramebuffer`) et débridage automatique `useVbo:true` / `enableVsync:false` / `maxFps:260`.
            - **Pipeline VAO OpenGL 3.0 + `GL_TRIANGLES`** : conversion matérielle 16-bit sans requête `glGetFloat` bloquante et Lazy Terrain BFS précis sans disparition des chunks latéraux.
            - **Entités & TileEntities** : **Item Frames compilés** en Display Lists (`1 glCallList`), **Joueurs distants LOD** + cache d'armures `O(1)`, **Panneaux zéro-allocation** et culling frustum P-Vertex des coffres.

            ### Singularity Launcher & Auto-Updater
            - **Trou Noir relativiste temps-réel (`WebGL2`)** : lentille gravitationnelle de Schwarzschild et disque d'accrétion Doppler.
            - **Transition sans changement de fenêtre visible** : plongeon caméra dans l'Horizon des Événements (`#000000` plein écran sans bordure) et émergence directe sur le menu Minecraft 1.8.9.
            - **Auto-Updater GitHub Releases intégré** : mise à jour automatique de `purefps-*.jar` et `pureclient-launcher.exe`.
          generate_release_notes: true
          files: build/libs/purefps-${{ steps.ver.outputs.version }}.jar

  build-and-attach-launcher:
    name: Build & Attach Singularity Launcher (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Launcher Cargo.toml version with Tag
        id: ver
        shell: pwsh
        run: |
          $rawTag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $cleanVer = $rawTag.TrimStart('v')
          "tag=$rawTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $cargoPath = "launcher/Cargo.toml"
          $content = Get-Content $cargoPath -Raw
          $updated = [regex]::Replace($content, '(?m)^version\s*=\s*"[^"]+"', "version = `"$cleanVer`"", 1)
          Set-Content -Path $cargoPath -Value $updated -NoNewline

      - name: Build PureClient Singularity Launcher (.exe)
        working-directory: launcher
        env:
          PURECLIENT_GITHUB_TOKEN: ${{ secrets.PURECLIENT_UPDATER_TOKEN }}
        run: cargo build --release

      - name: Attach Windows Launcher (.exe) to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          for ($i = 0; $i -lt 48; $i++) {
            gh release view $tag --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          gh release upload $tag "launcher/target/release/pureclient-launcher.exe" --repo "${{ github.repository }}" --clobber
