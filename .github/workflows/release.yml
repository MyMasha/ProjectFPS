name: MashClient Release (Mod 1.8.9 + MashClient.exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version à publier (ex: v4.4.0)"
        required: true
        default: "v4.4.0"

permissions:
  contents: write

jobs:
  publish-mod-release:
    name: Build Mod 1.8.9 (.jar) & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK 8 & JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Extract semantic version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"

      - name: Compile & Test MashClient Forge 1.8.9 Mod
        shell: bash
        run: |
          sed -i '/^org\.gradle\.java\./d' gradle.properties
          echo "org.gradle.java.home=${JAVA_HOME_17_X64}" >> gradle.properties
          echo "org.gradle.java.installations.auto-detect=false" >> gradle.properties
          echo "org.gradle.java.installations.paths=${JAVA_HOME_8_X64},${JAVA_HOME_17_X64}" >> gradle.properties
          sed -i "s/^version=.*/version=${{ steps.ver.outputs.version }}/" gradle.properties
          chmod +x ./gradlew
          ./gradlew test remapJar --no-daemon

      - name: Create or Update GitHub Release with Mod JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MashClient ${{ steps.ver.outputs.tag }}
          body: |
            ## MashClient ${{ steps.ver.outputs.version }}

            - **Pipeline FPS NVIDIA & OpenGL débridé** : désactivation du `SharedDrawable` (`wglShareLists`) de Forge `SplashProgress` pour conserver la *Threaded Optimization* du pilote NVIDIA, file statique différée sans verrou (`DEFERRED_STATIC_QUEUE`) dans `SmartChunkUpdateScheduler`, EBO hissé dans `ChunkRegionManager`, limiteur FPS hors-focus intelligent et `0 %` d'activité WebView2/DWM une fois réduit dans la zone de notification.
            - **Module `TNT Timer` 3D** : compte à rebours flottant interpolé (`0.00s`) au-dessus de chaque TNT amorcée avec code couleur dynamique (vert, ambre, orange, rouge), compatible Hypixel BedWars (`2.60s` / `52 ticks`) et Vanilla / SkyWars (`4.00s` / `80 ticks`).
            - **Son d'ambiance du Trou Noir (activable / désactivable)** : onde gravitationnelle stéréo en boucle continue sur le menu d'accueil en jeu et dans le Launcher, coupée dès l'entrée en partie et commutable à tout moment depuis l'en-tête ou les paramètres.
            - **Interface compacte style Lunar Client & icônes vectorielles** : textes sobres et naturels sur l'ensemble des modules, icônes vectorielles dédiées et boutons/cartes réduits dans le Launcher comme dans les menus `GuiPureMainMenu` et `RSHIFT`.
          generate_release_notes: true
          files: build/libs/purefps-${{ steps.ver.outputs.version }}.jar

  build-and-attach-launcher:
    name: Build & Attach MashClient.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Launcher Cargo.toml version with Tag
        id: ver
        shell: pwsh
        run: |
          $rawTag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $cleanVer = $rawTag.TrimStart('v')
          "tag=$rawTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $cargoPath = "launcher/Cargo.toml"
          $content = Get-Content $cargoPath -Raw
          $updated = [regex]::Replace($content, '(?m)^version\s*=\s*"[^"]+"', "version = `"$cleanVer`"", 1)
          Set-Content -Path $cargoPath -Value $updated -NoNewline

      - name: Build MashClient.exe (with embedded .ico resource)
        working-directory: launcher
        env:
          PURECLIENT_GITHUB_TOKEN: ${{ secrets.PURECLIENT_UPDATER_TOKEN }}
        run: cargo build --release

      - name: Attach MashClient.exe to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          for ($i = 0; $i -lt 48; $i++) {
            gh release view $tag --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          gh release upload $tag "launcher/target/release/MashClient.exe" --repo "${{ github.repository }}" --clobber
